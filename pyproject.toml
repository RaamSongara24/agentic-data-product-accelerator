[project]
name = "agentic-data-product"
version = "0.1.0"
description = "Agentic Data Product Design Platform — Milestone M6 adapter boundary and hardening"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Agentic Data Product Accelerator contributors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
adp-api = "agentic_data_product.app.main:run"
adp-migrate = "agentic_data_product.persistence.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_data_product"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentic_data_product/persistence/migrations/versions" = "agentic_data_product/persistence/migrations/versions"
"src/agentic_data_product/ui/static" = "agentic_data_product/ui/static"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-setuptools>=75.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: tests that require PostgreSQL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "N",
    "ASYNC",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["agentic_data_product"]
exclude = ["tests/"]
